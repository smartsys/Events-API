name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build --load -t events-api:latest .

      - name: Start container
        run: docker run -d --name events-api -p 5000:5000 events-api:latest

      - name: Wait for API to start
        run: |
          for i in $(seq 1 15); do
            curl -s http://localhost:5000/api/health && exit 0
            sleep 2
          done
          exit 1

      - name: Health check
        run: curl --fail http://localhost:5000/api/health
