name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build --load -t events-api:latest .

      - name: Start container
        run: docker run -d --name events-api -p 5000:5000 events-api:latest

      - name: Wait for API to start
        run: |
          for i in $(seq 1 15); do
            curl -s http://localhost:5000/api/health && exit 0
            sleep 2
          done
          exit 1

      - name: Health check
        run: curl --fail http://localhost:5000/api/health

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Stop container
        if: always()
        run: docker stop events-api

      - name: Remove container
        if: always()
        run: docker rm events-api

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest

      - name: Trigger Render deploy
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for Render to roll out
        run: sleep 60

      - name: Smoke test
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" "${{ secrets.RENDER_BASE_URL }}/api/health")
          echo "Status: $status"
          cat response.json
          test "$status" = "200"
          grep -q '"healthy"' response.json
